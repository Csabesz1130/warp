name: TargetGraph JEPA Cold Start
description: Run a TargetGraph JEPA cold-start training pass from Warp.
command: |
  bash integrations/targetgraph/tg-warp coldstart --domain {{domain}} --profile {{profile}}
arguments:
  - name: domain
    description: JEPA domain to train, or all.
    default: graph
  - name: profile
    description: Training profile.
    default: minimal
