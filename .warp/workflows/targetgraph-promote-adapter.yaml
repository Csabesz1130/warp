name: TargetGraph Promote Adapter
description: Promote a TargetGraph campaign adapter after gates pass.
command: |
  bash integrations/targetgraph/tg-warp promote --campaign {{campaign}} --adapter {{adapter}}
arguments:
  - name: campaign
    description: TargetGraph campaign name.
    default: catsper
  - name: adapter
    description: Adapter identifier to promote.
    default: catsper_v1
