[project]
name = "optix-mm"
version = "0.1.0"
description = "OptimismTax-MM: capturing the structural wealth transfer in Kalshi prediction markets."
requires-python = ">=3.11"
authors = [{name = "Csaba"}]
readme = "README.md"

dependencies = [
  "duckdb>=1.1.0",
  "polars>=1.13.0",
  "pyarrow>=18.0.0",
  "httpx>=0.28.0",
  "websockets>=14.0",
  "cryptography>=44.0.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "structlog>=24.4.0",
  "rich>=13.9.0",
  "numpy>=2.1.0",
  "python-dotenv>=1.0.1",
  "matplotlib>=3.9.0",
  "click>=8.1.7",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optix"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
